# What the GPU worker needs on Kaggle beyond the Kaggle image (torch, numpy, scipy, requests, accelerate
# and safetensors come with the image). Installed by kernel_template/run.py with
#   pip install --only-binary=:all: --no-deps --require-hashes -r requirements.lock
# so pip never resolves anything at boot, never touches the image's torch, and installs only the exact
# files hashed here (each version's Linux x86_64 wheels): one published later under the same version,
# or a changed one, is refused. Every line needs a wheel for the image's Python (cp3xx, abi3 or pure).
#
# These are the team laptop's tested versions. The Kaggle smoke run (docs/DEPLOY.md, "GPU on demand")
# replaces them with what its `pip freeze` and `pip check` show: keep only what the image lacks or has
# in a version that does not work, pin every one, then refresh the hashes:
#   python scripts/lock_hashes.py stutterclear/gpu_worker/requirements.lock
