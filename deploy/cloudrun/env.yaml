# The Cloud Run service's settings: no secrets here (those come from Secret Manager). Every deploy
# (scripts/deploy_cloudrun.ps1) sets exactly these plus what it works out itself, so a line removed
# here is removed from the service on the next deploy. The script adds, so never set them here:
# STUTTERCLEAR_PUBLIC_URL; and STUTTERCLEAR_GPU_LAUNCHER and STUTTERCLEAR_GPU_LIVE (GPU worker),
# or STUTTERCLEAR_NOTES=0 (-NoGpu). Every switch: docs/DEPLOY.md, "Switches".
STUTTERCLEAR_HOSTED: "1"
STUTTERCLEAR_TRUST_PROXY: "1"  # the visitor is the last X-Forwarded-For entry (Google's front end appends it; DEPLOY.md: how to check)
STUTTERCLEAR_VIDEO_MAX_MB: "150"
STUTTERCLEAR_CORS_ORIGINS: "https://pradyuman-aviator.github.io"  # the front door's health checks
STUTTERCLEAR_KAGGLE_KERNEL: "pradyumansharmaaa/stutterclear-gpu-worker"
STUTTERCLEAR_KAGGLE_WEIGHT_KERNELS: "pradyumansharmaaa/stutterclear-teacher,pradyumansharmaaa/stutterclear-teacher-v2"
# After the Kaggle smoke run: the image it ran on, so a Kaggle image update cannot break the worker.
# STUTTERCLEAR_KAGGLE_DOCKER_IMAGE: "gcr.io/kaggle-gpu-images/python@sha256:<digest>"
